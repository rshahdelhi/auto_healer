name: Docker Image CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build on both pull requests and pushes.
      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag auto-healer:${{ github.sha }} \
            .

      # Only authenticate and publish when code is pushed to develop.
      # Pull requests should validate the build without publishing an image.
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.Docker_hub_Cred }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag \
            auto-healer:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:${{ github.sha }}

          docker tag \
            auto-healer:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:develop

          docker tag \
            auto-healer:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:develop

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/auto-healer:latest
```
